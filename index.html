<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Гурт 1.0</title>
<style>
*{box-sizing:border-box}
body{font:17px system-ui;background:#f1f4f2;color:#183b32;margin:16px}
button,input,select{font:inherit;padding:12px;border:1px solid #bbc8c1;border-radius:9px}
button{background:#183b32;color:white;margin:4px}
input,select{width:100%;margin:5px 0;background:white}
nav[hidden]{display:none} @media print{#cloudbar{display:none}} nav{display:grid;grid-template-columns:1fr 1fr;gap:5px}
section{background:white;padding:16px;border-radius:12px;margin-top:12px}
label{display:block;margin-top:10px}
small{color:#52655d}
table{width:100%;border-collapse:collapse}
td,th{padding:7px;border-bottom:1px solid #ddd;text-align:left}
@media print{nav,button,h1,small{display:none}body{background:white;color:black}section{padding:0}}
 .official table td,.official table th{border:1px solid #aaa;padding:5px;font-size:13px;overflow-wrap:anywhere}.official h2{text-align:center}.official table{table-layout:auto}.official{overflow-x:auto} @media print{@page{size:A4;margin:15mm}body{margin:0;font-size:12pt}.official table td,.official table th{font-size:10pt}tr{break-inside:avoid} }
.scanner{max-width:100%;overflow:hidden}.scanview{position:relative;background:#111;border-radius:10px;overflow:hidden}.scanview video{display:block;width:100%;max-height:55vh;object-fit:contain}.scanframe{position:absolute;left:8%;right:8%;top:35%;bottom:35%;border:2px solid #6ee7a0;border-radius:8px;pointer-events:none}.scanner p{font-size:14px;overflow-wrap:anywhere}</style>
</head>
<body>
<h1>Гурт 1.0</h1>
<small>Тестова версія 0.9</small>
<div id="cloudbar" style="margin:10px 0"></div><nav id="appnav" hidden>
<button onclick="show('receive')">Приймання</button>
<button onclick="show('sale')">Продаж</button>
<button onclick="show('stock')">Залишки</button>
<button onclick="show('history')">Накладні</button>
<button onclick="show('settings')">Налаштування</button>
<button onclick="show('reports')">Звіти</button>
</nav>
<section id="main"></section>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
let db;
try{
db=JSON.parse(localStorage.getItem('gurt-v1'))||{products:[],sales:[]};
}catch(e){db={products:[],sales:[]}}
db.sellers ||= [];
let cart=[],selected=null;
const main=document.getElementById('main');
const el=id=>document.getElementById(id);
const val=id=>el(id).value.trim();
const num=id=>Number(val(id));
const money=n=>Number(n).toFixed(2);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const cloud=window.supabase?.createClient('https://yzqkufiehzkfoalcjfdi.supabase.co','sb_publishable_tN80HeOWhKPL8u-NihLPWQ_L05-Vetx');
let user=null, revision=null, busy=false, ready=false;
let checking=false, remotePending=false;
const localOriginal=JSON.parse(JSON.stringify(db));
function lock(v){busy=v;document.body.inert=v;}
function validDB(x){return x&&Array.isArray(x.products)&&Array.isArray(x.sales)&&Array.isArray(x.sellers)}
function status(t){el('cloudbar').textContent=t; if(ready){let b=document.createElement('button');b.textContent='Оновити з хмари';b.onclick=loadCloud;el('cloudbar').append(b);let c=document.createElement('button');c.textContent='Вийти';c.onclick=logout;el('cloudbar').append(c)}}
async function save(){
 if(!ready||busy)return false;lock(true);
 try{let payload={data:db,updated_at:new Date().toISOString(),version:revision+1};let r=await cloud.from('gurt_data').update(payload).eq('user_id',user.id).eq('version',revision).select('version').maybeSingle();if(r.error)throw r.error;if(!r.data)throw Error('База змінена на іншому пристрої. Оновіть з хмари та повторіть операцію.');revision=r.data.version;remotePending=false;status('Хмара: збережено');return true}catch(e){status('Хмара: зміни не підтверджено');alert('Не вдалося підтвердити збереження. '+e.message+' Оновіть базу перед повтором.');return false}finally{lock(false)}
}
function loginPage(){ready=false;el('appnav').hidden=true;status('Хмара: вхід потрібен');main.innerHTML='<h2>Вхід до Гурт</h2><label>Електронна пошта</label><input id="email" type="email" autocomplete="username"><label>Пароль</label><input id="password" type="password" autocomplete="current-password"><button onclick="login()">Увійти</button><p>Для роботи потрібен інтернет.</p>';}
async function login(){if(!cloud)return alert('Бібліотека Supabase не завантажилась');let email=val('email'),password=el('password').value;lock(true);try{let r=await cloud.auth.signInWithPassword({email,password});if(r.error)throw r.error;user=r.data.user;}catch(e){alert(e.message);return}finally{lock(false)}await loadCloud()}
async function logout(){if(busy)return;if(!confirm('Вийти з програми?'))return;let r=await cloud.auth.signOut();if(r.error)return alert(r.error.message);user=null;db={products:[],sales:[],sellers:[]};cart=[];loginPage()}
async function loadCloud(){if(busy)return;lock(true);ready=false;el('appnav').hidden=true;try{let r=await cloud.from('gurt_data').select('data,version').eq('user_id',user.id).maybeSingle();if(r.error)throw r.error;if(!r.data){main.innerHTML='<h2>Перший запуск</h2><p>Хмарна база порожня. Оберіть початкові дані.</p><button onclick="initCloud(true)">Перенести дані з цього браузера</button><button onclick="initCloud(false)">Створити порожню базу</button><p>Резервну копію JSON можна відновити після запуску.</p>';status('Хмара: ще не налаштована');return}if(!validDB(r.data.data))throw Error('Невідомий формат даних');db=r.data.data;revision=r.data.version;remotePending=false;ready=true;cart=[];el('appnav').hidden=false;status('Хмара: підключено');show('receive')}catch(e){status('Хмара: помилка');main.innerHTML='<p>'+esc(e.message)+'</p><button onclick="loadCloud()">Повторити</button><button onclick="logout()">Вийти</button>'}finally{lock(false)}}
async function initCloud(useLocal){if(busy)return;if(!confirm('Створити початкову хмарну базу?'))return;lock(true);try{let data=useLocal?localOriginal:{products:[],sales:[],sellers:[],adjustments:[]};let r=await cloud.from('gurt_data').insert({user_id:user.id,data,version:1});if(r.error)throw r.error}catch(e){alert(e.message)}finally{lock(false)}await loadCloud()}
async function boot(){loginPage();if(!cloud)return;try{let r=await cloud.auth.getUser();if(r.data.user){user=r.data.user;await loadCloud()}}catch(e){status('Хмара: помилка підключення')}}
function show(page){
 if(window.stopScan)window.stopScan();
selected=null;
if(page==='reports'){reportPage();return}
if(page==='settings'){settings();return}
 if(page==='receive'){
main.innerHTML=`
<h2>Приймання товару</h2>
<label>Штрихкод</label>
<input id="code" oninput="selected=null" onchange="lookup('code')" onkeydown="if(event.key==='Enter'){event.preventDefault();lookup('code')}"><button onclick="scan('lookup')">Камера</button>
<button onclick="lookup()">Знайти товар</button>
<div id="matches"></div>
<label>Артикул</label><input id="art" oninput="selected=null;el('code').value=''" onchange="lookup('art')" onkeydown="if(event.key==='Enter'){event.preventDefault();lookup('art')}"><button onclick="lookup('art')">Знайти за артикулом</button>
<label>Назва товару</label><input id="name">
<label>Колір (необов'язково)</label><input id="color">
<label>Штук у ростовці</label>
<input id="units" type="number" min="1" value="4">
<label>Кількість ростовок</label>
<input id="qty" type="number" min="1" value="1">
<label>Продажна ціна за штуку, $</label>
<input id="price" type="number" step="0.01" min="0.01">
<button onclick="receive()">Зберегти товар</button>`;
}
if(page==='stock'){
main.innerHTML='<h2>Залишки товару</h2><input id="stockquery" placeholder="Назва, артикул, штрихкод" oninput="stockList()"><div id="stocklist"></div>';stockList();
}
if(page==='sale'){
main.innerHTML=`
<h2>Продаж товару</h2>
<label>Штрихкод або артикул</label>
<input id="code" onkeydown="if(event.key==='Enter'){event.preventDefault();findSale()}"><button onclick="scan('findSale')">Камера</button>
<button onclick="findSale()">Знайти</button>
<div id="matches"></div>
<hr><h3>Кошик</h3><div id="cart"></div>
<label>Продавець</label><select id="seller"><option value="">Не вибрано</option>${db.sellers.filter(x=>!x.inactive).map(x=>`<option value="${esc(x.id)}">${esc(x.short||x.name)}</option>`).join('')}</select>
<label>Тип накладної</label><select id="kind" onchange="el('buyerextra').hidden=this.value==='normal'"><option value="normal">Звичайна</option><option value="official">Офіційна видаткова</option></select>
<label>Покупець</label><input id="buyer"><div id="buyerextra" hidden><label>ІПН / код покупця (за наявності)</label><input id="buyerid"><label>Адреса покупця (за потреби)</label><input id="buyeraddress"></div>
<label>Курс долара, грн</label>
<input id="rate" type="number" step="0.01" placeholder="Введіть курс">
<button onclick="finish()">Провести продаж</button>`;
renderCart();
}
if(page==='history'){historyPage();}
}
function lookup(field){
selected=null;
let q=val(field|| (val('code')?'code':'art'));
let a=q?db.products.filter(p=>String(p.code)===q||String(p.art)===q):[];
el('matches').innerHTML=(a.length?'Виберіть товар / колір: ':'Товар не знайдено. ')+a.map(p=>`<button onclick="pick('${esc(p.id)}')">${esc(p.name)} · арт. ${esc(p.art)} · ${esc(p.color||'Без кольору')} · ${p.qty} рост.</button>`).join('')+'<button onclick="newProduct()">Новий товар / колір</button>';
if(a.length===1)pick(a[0].id);
}
function newProduct(){
selected=null;
for(let k of ['name','color','price'])el(k).value='';
el('matches').innerHTML='Новий товар / колір';
}
function pick(id){
let p=db.products.find(x=>x.id===id);
if(!p)return;
selected=id;
for(let k of ['code','art','name','color','units','price'])el(k).value=p[k]??'';
}
async function receive(){
let p={code:val('code'),art:val('art'),name:val('name'),color:val('color'),units:num('units'),qty:num('qty'),price:num('price')};
if(!p.code||!p.name||!p.art||!Number.isInteger(p.units)||p.units<1||!Number.isInteger(p.qty)||p.qty<1||!Number.isFinite(p.price)||p.price<=0)return alert('Перевірте всі поля');
let old=db.products.find(x=>x.id===selected);
if(!old){let same=db.products.filter(x=>x.code===p.code&&x.art===p.art&&(x.color||'').trim().toLowerCase()===p.color.toLowerCase()&&x.units===p.units);if(same.length>1)return alert('Знайдено дублікати. Виберіть товар зі списку');if(same.length===1)old=same[0];}
if(old&&(old.units!==p.units||old.color!==p.color||old.code!==p.code))return alert('Створіть новий варіант товару');
let backup=JSON.stringify(db);
if(old){
old.qty+=p.qty;
old.price=p.price;
old.name=p.name;
old.art=p.art;
}else{
db.products.push({...p,id:Date.now().toString(36)+Math.random().toString(36).slice(2)});
}
if(!await save()){db=JSON.parse(backup);return}
show('receive');
alert('Товар прийнято!');
}
function findSale(){
let q=val('code');
el('matches').innerHTML=db.products.filter(p=>p.qty>0&&(p.code===q||p.art===q)).map(p=>`<button onclick="add('${p.id}')">Додати: ${esc(p.name)} · арт. ${esc(p.art)} ${esc(p.color)} · ${p.qty} рост.</button>`).join('')||'Товар не знайдено';
}
function add(id){
let p=db.products.find(x=>x.id===id);
let c=cart.find(x=>x.id===id);
if((c?.qty||0)>=p.qty)return alert('Недостатньо товару');
if(c)c.qty++;
else cart.push({...p,qty:1});
renderCart();
el("code").value="";el("matches").innerHTML="";
}
function renderCart(){
el('cart').innerHTML=(cart.length?"":"<p>Кошик порожній. Знайдіть товар і натисніть «Додати».</p>")+cart.map((p,i)=>`<p><b>${esc(p.name)} · арт. ${esc(p.art)} ${esc(p.color)}</b><br>
<label for="cartqty${i}">Кількість ростовок (наявно: ${db.products.find(x=>x.id===p.id).qty})</label>
<input id="cartqty${i}" type="number" inputmode="numeric" min="1" max="${db.products.find(x=>x.id===p.id).qty}" step="1" value="${p.qty}" onchange="setQty(${i},this.value)">
<span id="lineqty${i}">${p.qty} рост. × ${p.units} шт. = ${p.qty*p.units} шт.</span><br>
<span id="linesum${i}">$${money(p.qty*p.units*p.price)}</span>
<button onclick="removeItem(${i})">−</button><button onclick="cart.splice(${i},1);renderCart()">Видалити</button>
<button onclick="add('${p.id}')">+</button></p>`).join('')+
'<b id="carttotal">Разом: $'+money(cart.reduce((s,p)=>s+p.qty*p.units*p.price,0))+'</b>';
}
function setQty(i,value){
let p=cart[i], q=Number(value), stock=db.products.find(x=>x.id===p.id).qty;
if(!Number.isInteger(q)||q<1||q>stock){
el('cartqty'+i).value=p.qty;
alert('Введіть цілу кількість від 1 до '+stock);
return;
}
p.qty=q;
el('lineqty'+i).textContent=`${q} рост. × ${p.units} шт. = ${q*p.units} шт.`;
el('linesum'+i).textContent='$'+money(q*p.units*p.price);
el('carttotal').textContent='Разом: $'+money(cart.reduce((s,p)=>s+p.qty*p.units*p.price,0));
}
function removeItem(i){
cart[i].qty--;
if(cart[i].qty===0)cart.splice(i,1);
renderCart();
}
async function finish(){
let rate=num('rate');
if(!cart.length||!Number.isFinite(rate)||rate<=0)return alert('Перевірте товар і курс');
if(cart.some(c=>db.products.find(p=>p.id===c.id).qty<c.qty))return alert('Недостатньо залишку');
let seller=db.sellers.find(x=>x.id===val('seller'));
 if(val('kind')==='official'&&(!seller||!val('buyer')))return alert('Виберіть ФОП та введіть покупця');
 let s={seller:seller?{...seller}:null,kind:val('kind'),buyerid:val('buyerid'),buyeraddress:val('buyeraddress'),createdAt:new Date().toISOString(),date:new Date().toLocaleString('uk-UA'),buyer:val('buyer'),rate,items:cart,total:cart.reduce((s,p)=>s+p.qty*p.units*p.price,0)};
let backup=JSON.stringify(db);
cart.forEach(c=>db.products.find(p=>p.id===c.id).qty-=c.qty);
db.sales.push(s);
 if(s.kind==='official')assignOfficial(s,seller);
if(!await save()){db=JSON.parse(backup);return}
cart=[];
invoice(db.sales.length-1,s.kind);
}
function invoice(i,kind){
let s=db.sales[i];
if(kind==='official'&&s.officialNo)return officialInvoice(i);
main.innerHTML=`<h2>Товарна накладна № ${i+1}</h2>
<p>${esc(s.date)}<br>${esc(s.buyer)}</p>
<table><tr><th>Товар</th><th>Шт.</th><th>$/шт.</th><th>Сума $</th></tr>
${s.items.map(p=>`<tr><td>${esc(p.name)} ${esc(p.art)} ${esc(p.color)}</td><td>${p.qty*p.units}</td><td>${money(p.price)}</td><td>${money(p.qty*p.units*p.price)}</td></tr>`).join('')}
</table>
<p>Всього: ${s.items.reduce((n,p)=>n+p.qty*p.units,0)} шт.</p>
<h3>Разом: $${money(s.total)}</h3>
<p>Курс: ${s.rate}</p>
<h2>${money(s.total*s.rate)} грн</h2>
<button onclick="printDoc(${i},false)">Друк / PDF</button>${(!s.cancelled||s.officialNo)?`<button onclick="makeOfficial(${i})">Офіційна накладна</button>`:''}${saleActions(i)}`;
}

function returned(s,j){return (s.returns||[]).reduce((n,r)=>n+(r.lines||[]).filter(l=>l.j===j).reduce((a,l)=>a+l.qty,0),0)}
function netTotal(s){return s.cancelled?0:s.items.reduce((n,p,j)=>n+(p.qty-returned(s,j))*p.units*p.price,0)}
function saleStatus(s){return s.cancelled?'Скасована':(s.returns||[]).length?(s.items.every((p,j)=>returned(s,j)===p.qty)?'Повністю повернена':'Частково повернена'):'Дійсна'}
function returnSummary(s){return `<p><b>Статус: ${saleStatus(s)}</b></p>${(s.returns||[]).map(r=>`<p>${esc(r.date)} · ${r.cancel?'Скасування':'Повернення'} · $${money(r.total)} / ${money(r.total*s.rate)} грн<br>${esc(r.reason)}<br>${r.lines.map(l=>esc(s.items[l.j].art)+' — '+l.qty+' рост.').join('; ')}</p>`).join('')}`}
function saleActions(i){let s=db.sales[i];return returnSummary(s)+(!s.cancelled&&s.items.some((p,j)=>p.qty>returned(s,j))?`<button onclick="returnForm(${i})">Повернення товару</button>`:'')+(!s.cancelled?`<button onclick="cancelSale(${i})">Скасувати накладну</button>`:'')}
function returnForm(i){let s=db.sales[i];if(s.cancelled)return;main.innerHTML=`<h2>Повернення за накладною № ${i+1}</h2>${s.items.map((p,j)=>{let max=p.qty-returned(s,j);return `<label>${esc(p.name)} · ${esc(p.art)} ${esc(p.color)} — $${money(p.price)}/шт. (можна повернути ${max} рост.)</label><input id="ret${j}" type="number" min="0" max="${max}" step="1" value="0" ${max===0?'disabled':''}>`}).join('')}<label>Причина</label><input id="retreason" placeholder="Причина повернення"><button onclick="submitReturn(${i})">Підтвердити повернення</button><button onclick="invoice(${i},'normal')">Назад</button>`}
function submitReturn(i){let s=db.sales[i];if(s.cancelled)return;let lines=s.items.map((p,j)=>({j,qty:num('ret'+j)}));if(lines.some(l=>!Number.isSafeInteger(l.qty)||l.qty<0||l.qty>s.items[l.j].qty-returned(s,l.j)))return alert('Перевірте кількість');lines=lines.filter(l=>l.qty>0);let reason=val('retreason');if(!lines.length||!reason)return alert('Вкажіть кількість та причину');if(confirm('Повернути вибраний товар на склад?'))applyReturn(i,lines,reason,false)}
function cancelSale(i){let s=db.sales[i];if(s.cancelled)return;let reason=prompt('Причина скасування накладної');if(!reason||!reason.trim())return;if(!confirm('Скасувати накладну та повернути лише ще не повернений товар?'))return;applyReturn(i,s.items.map((p,j)=>({j,qty:p.qty-returned(s,j)})).filter(l=>l.qty>0),reason.trim(),true)}
async function applyReturn(i,lines,reason,cancel){let s=db.sales[i];if(s.cancelled||lines.some(l=>!Number.isSafeInteger(l.qty)||l.qty<=0||l.qty>s.items[l.j].qty-returned(s,l.j)))return alert('Операція недоступна');let targets=lines.map(l=>db.products.find(p=>p.id===s.items[l.j].id&&p.units===s.items[l.j].units));if(targets.some(p=>!p))return alert('Товар не знайдено на складі. Операцію не виконано.');let old=JSON.stringify(db);lines.forEach((l,k)=>targets[k].qty+=l.qty);let total=lines.reduce((n,l)=>{let p=s.items[l.j];return n+l.qty*p.units*p.price},0);(s.returns||=[]).push({date:new Date().toLocaleString('uk-UA'),lines,total,reason,cancel});if(cancel)s.cancelled=true;if(!await save()){db=JSON.parse(old);return}cart=[];invoice(i,'normal')}
function stockList(){let q=val('stockquery').toLowerCase();el('stocklist').innerHTML=db.products.filter(p=>[p.name,p.art,p.code,p.color].join(' ').toLowerCase().includes(q)).map(p=>`<p><b>${esc(p.name)}</b><br>Арт. ${esc(p.art)} ${esc(p.color)}<br>${p.qty} рост. / ${p.qty*p.units} шт.<br>Ціна: $${money(p.price)}<br><button onclick="editProduct(${db.products.indexOf(p)})">Редагувати</button><button onclick="adjustProduct(${db.products.indexOf(p)})">Коригувати залишок</button></p><hr>`).join('')||'Товарів не знайдено'}

function editProduct(i){let p=db.products[i];main.innerHTML=`<h2>Редагування товару</h2>${[['code','Штрихкод'],['art','Артикул'],['name','Назва'],['color','Колір'],['price','Ціна за штуку, $']].map(([k,l])=>`<label>${l}</label><input id="ep_${k}" value="${esc(p[k])}" ${k==='price'?'type="number" step="0.01" min="0.01"':''}>`).join('')}<p>Штук у ростовці: ${p.units}</p><button onclick="saveProductEdit(${i})">Зберегти</button><button onclick="show('stock')">Назад</button>`}

const uaMoney=n=>Number(n).toLocaleString("uk-UA",{minimumFractionDigits:2,maximumFractionDigits:2});
function officialInvoice(i){let s=db.sales[i],x=s.seller;let rows=s.items.map(p=>{let qty=p.qty*p.units,price=Math.round(p.price*s.rate*100)/100;return {p,qty,price,sum:Math.round(qty*price*100)/100}});let total=rows.reduce((a,r)=>a+r.sum,0);main.innerHTML=`<div class="official"><h2>Видаткова накладна № ${s.officialNo}</h2><p><b>Статус: ${saleStatus(s)}</b></p><p>Дата: ${esc(s.date.split(",")[0].split(" ")[0])}</p><p><b>Постачальник:</b> ФОП ${esc(x.name)}<br>РНОКПП: ${esc(x.tax)}${x.address?'<br>Адреса: '+esc(x.address):''}${x.iban?'<br>IBAN: '+esc(x.iban):''}${x.bank?'<br>Банк: '+esc(x.bank):''}</p><p><b>Покупець:</b> ${esc(s.officialBuyer||s.buyer)}${s.buyerid?'<br>Код: '+esc(s.buyerid):''}${s.buyeraddress?'<br>Адреса: '+esc(s.buyeraddress):''}</p><table><tr><th>№</th><th>Артикул</th><th>Товар</th><th>Од.</th><th>К-ть</th><th>Ціна, грн</th><th>Сума, грн</th></tr>${rows.map((r,j)=>`<tr><td>${j+1}</td><td>${esc(r.p.art)}</td><td>${esc(r.p.name)} ${esc(r.p.color)}</td><td>шт.</td><td>${r.qty}</td><td>${uaMoney(r.price)}</td><td>${uaMoney(r.sum)}</td></tr>`).join('')}</table><p>Без ПДВ</p><h3>Всього: ${uaMoney(total)} грн</h3><p>Сума прописом: ${wordsMoney(total)}</p><p>Відпустив (ПІБ, підпис): __________________</p><p>Отримав (ПІБ, підпис): __________________</p><button onclick="printDoc(${i},true)">Друк / PDF</button><button onclick="invoice(${i},'normal')">Звичайна накладна</button></div>`}
function wordsMoney(n){let a=['','один','два','три','чотири','п’ять','шість','сім','вісім','дев’ять'],b=['десять','одинадцять','дванадцять','тринадцять','чотирнадцять','п’ятнадцять','шістнадцять','сімнадцять','вісімнадцять','дев’ятнадцять'],t=['','','двадцять','тридцять','сорок','п’ятдесят','шістдесят','сімдесят','вісімдесят','дев’яносто'],h=['','сто','двісті','триста','чотириста','п’ятсот','шістсот','сімсот','вісімсот','дев’ятсот'];let form=(v,f)=>f[v%100>=11&&v%100<=14?2:v%10===1?0:v%10>=2&&v%10<=4?1:2];let part=(v,f)=>[h[Math.floor(v/100)],v%100>=10&&v%100<20?b[v%10]:[t[Math.floor(v%100/10)],f&&v%10===1?'одна':f&&v%10===2?'дві':a[v%10]].filter(Boolean).join(' ')].filter(Boolean).join(' ');let cents=Math.round(n*100),v=Math.floor(cents/100),out=[],z=v;let scales=[null,['тисяча','тисячі','тисяч'],['мільйон','мільйони','мільйонів'],['мільярд','мільярди','мільярдів']];for(let j=0;z&&j<4;j++,z=Math.floor(z/1000)){let k=z%1000;if(k)out.unshift(part(k,j<=1)+(j?' '+form(k,scales[j]):''))}return (out.join(' ')||'нуль')+' '+form(v,['гривня','гривні','гривень'])+' '+String(cents%100).padStart(2,'0')+' коп.'}

function reportPeriod(){let p=val('rp'),d=new Date(),a=new Date(d);if(p==='custom')return reportList();if(p==='yesterday'){a.setDate(a.getDate()-1);d=a}if(p==='week')a.setDate(a.getDate()-6);if(p==='month')a.setDate(1);el('rf').value=p==='all'?'':localDay(a);el('rt').value=p==='all'?'':localDay(d);reportList()}
function reportData(rows){let gross=0,net=0,grossUA=0,netUA=0,packs=0,pieces=0,active=0,cancelled=0,groups=new Map(),goods=new Map();for(let s of rows){let g=s.total,n=netTotal(s);gross+=g;net+=n;grossUA+=g*s.rate;netUA+=n*s.rate;if(s.cancelled)cancelled++;else if(s.items.some((p,j)=>p.qty>returned(s,j)))active++;let key=s.seller?.id||'none',v=groups.get(key)||{name:s.seller?.short||s.seller?.name||'Без ФОП',usd:0,uah:0};v.usd+=n;v.uah+=n*s.rate;groups.set(key,v);s.items.forEach((p,j)=>{let q=s.cancelled?0:p.qty-returned(s,j);if(q<=0)return;packs+=q;pieces+=q*p.units;let k=p.id||JSON.stringify([p.art,p.color,p.name]),x=goods.get(k)||{name:p.name,art:p.art,color:p.color,packs:0,pieces:0,usd:0};x.packs+=q;x.pieces+=q*p.units;x.usd+=q*p.units*p.price;goods.set(k,x)})}return {gross,net,grossUA,netUA,packs,pieces,active,cancelled,groups,goods}}
function reportList(){let f=val('rf'),t=val('rt'),seller=val('rs');if(f&&t&&f>t){el('reportresult').textContent='Дата початку має бути не пізніше дати завершення.';return}let rows=db.sales.filter(s=>{let d=saleDay(s);return (!f||d&&d>=f)&&(!t||d&&d<=t)&&(!seller||(seller==='none'?!s.seller?.id:s.seller?.id===seller))}),r=reportData(rows),fmt=(u,h)=>`$${uaMoney(u)} / ${uaMoney(h)} грн`,stock=db.products.reduce((a,p)=>({packs:a.packs+p.qty,pieces:a.pieces+p.qty*p.units,value:a.value+p.qty*p.units*p.price}),{packs:0,pieces:0,value:0});el('reportresult').innerHTML=`<hr><h3>Продажі після повернень</h3><h2>${fmt(r.net,r.netUA)}</h2><p>Початкові продажі: ${fmt(r.gross,r.grossUA)}<br>Повернення та скасування: ${fmt(r.gross-r.net,r.grossUA-r.netUA)}<br>Накладних: ${rows.length} · з продажем: ${r.active} · скасованих: ${r.cancelled}<br>Продано: ${r.packs} рост. / ${r.pieces} шт.</p><small>Період визначається датою початкової накладної; враховано всі її повернення, навіть пізніші.</small><hr><h3>По ФОП</h3>${[...r.groups.values()].map(x=>`<p><b>${esc(x.name)}</b><br>${fmt(x.usd,x.uah)}</p>`).join('')||'Немає продажів'}<hr><h3>Найбільш продавані товари</h3><small>За кількістю штук після повернень</small>${[...r.goods.values()].sort((a,b)=>b.pieces-a.pieces).map(x=>`<p><b>${esc(x.name)}</b><br>Арт. ${esc(x.art)} ${esc(x.color)}<br>${x.packs} рост. / ${x.pieces} шт. · $${uaMoney(x.usd)}</p>`).join('')||'<p>Немає продажів</p>'}<hr><h3>Склад — поточні залишки</h3><p>${stock.packs} рост. / ${stock.pieces} шт.</p><h2>$${uaMoney(stock.value)}</h2><small>Усі товари, незалежно від періоду та ФОП. За поточними продажними цінами.</small>`}

// Background reads never replace data underneath an editable form.
async function autoSync(){
 if(!ready||!user||busy||checking||document.hidden)return;
 checking=true;const uid=user.id, base=revision;
 try{
  const r=await cloud.from('gurt_data').select('data,version').eq('user_id',uid).maybeSingle();
  if(!ready||busy||user?.id!==uid||revision!==base)return;
  if(r.error)throw r.error;
  if(!r.data||!validDB(r.data.data))throw Error('База недоступна');
  if(r.data.version===base){if(!remotePending)status('Хмара: підключено');return;}
  const stock=!!el('stocklist'), history=!!el('hl'), report=!!el('reportresult');
  if(cart.length||!(stock||history||report)){
   remotePending=true;status('Хмара: є нові дані. Завершіть або скасуйте введення та оновіть базу.');return;
  }
  db=r.data.data;revision=r.data.version;remotePending=false;
  if(stock)stockList();
  if(history||report){
   const ids=history?['hq','hs','hf','ht']:['rp','rf','rt','rs'];
   const values=ids.map(id=>el(id).value);
   if(history)historyPage();else reportPage();
   ids.forEach((id,i)=>{el(id).value=values[i];});
   if(history)historyList();else reportList();
  }
  status('Хмара: автоматично оновлено');
 }catch(e){if(ready&&!busy&&user?.id===uid&&revision===base)status('Хмара: не вдалося перевірити зміни');}
 finally{checking=false;}
}
setInterval(autoSync,5000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)autoSync()});
window.addEventListener('focus',autoSync);
boot();
</script>
